apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: gitops-environment
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.6.5'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-upjet-github
    version: '>=v0.19.0'
  description: Registers a GitOps workload environment by composing its GitHub repository,
    Kubernetes namespace, authenticated Argo CD webhook, and root Application.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # gitops-environment

    Creates or imports a GitHub environment repository, creates its workload
    namespace, configures an authenticated Argo CD webhook, and creates the
    root Argo CD Application that syncs the environment app-of-apps chart.
  repository: ghcr.io/hops-ops/gitops-environment
  source: github.com/hops-ops/gitops-environment
