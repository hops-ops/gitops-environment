apiVersion: hops.ops.com.ai/v1alpha1
kind: GitopsEnvironment
metadata:
  name: development
  namespace: production
spec:
  providerConfigRefs:
    github:
      name: github
      kind: ProviderConfig
    kubernetes:
      name: production
      kind: ProviderConfig
  namespace:
    name: development
    allowDelete: true
  repository:
    owner: gitkb
    name: gitkb-development-env
    description: GitKB development environment
    allowDelete: true
    template:
      owner: hops-ops
      repository: gitops-template
  application:
    name: gitkb-environment-development

