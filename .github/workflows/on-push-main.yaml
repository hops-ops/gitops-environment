name: on-push-main

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/on-push-main.yaml"
      - ".github/workflows/on-version-tagged.yaml"
      - "apis/**"
      - "examples/**"
      - "functions/**"
      - "tests/**"
      - "upbound.yaml"

permissions:
  packages: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  validate:
    uses: hops-ops/workflows-crossplane/.github/workflows/validate.yaml@v3.2.0
    with:
      examples: |
        [
          { "example": "examples/gitopsenvironments/import-existing.yaml" },
          { "example": "examples/gitopsenvironments/from-template.yaml" },
          { "example": "examples/gitopsenvironments/shared-preview.yaml" }
        ]
      api_path: apis/gitopsenvironments
      error_on_missing_schemas: true

  test:
    uses: hops-ops/workflows-crossplane/.github/workflows/test.yaml@v3.2.0

  version-and-tag:
    name: Version and Tag
    needs:
      - validate
      - test
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@v1.21.3
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    with:
      useDeployKey: true
